<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Padel Matchmaker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('home') }}">Padel Matchmaker</a>
    {% if session.get('user_id') %}
      <nav>
        <a href="{{ url_for('bookings.index') }}">Bookings</a>
        <a href="{{ url_for('matchmaking.index') }}">Games</a>
      </nav>
      <span class="user">{{ session['username'] }}</span>
      <form method="post" action="{{ url_for('accounts.logout') }}">
        <button type="submit">Log out</button>
      </form>
    {% endif %}
  </header>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <p class="flash {{ category }}">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
